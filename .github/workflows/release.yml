name: Release

# Builds the static armhf binary, packages it as a KUAL extension zip and
# attaches it to the GitHub release when a `v*` tag is pushed.
#
# Pull requests that touch the release pipeline run the same build without
# publishing, so a broken pipeline shows up in review instead of on the next
# tag.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-armhf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RUST_TARGET: armv7-unknown-linux-musleabihf
      # The same image as `just build`: it ships the armv7-musl gcc that
      # build.rs uses for FBInk and that aws-lc-sys/rusqlite need for their C
      # code.
      IMAGE: messense/rust-musl-cross:armv7-musleabihf
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${{ github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match Cargo.toml version $version."
            exit 1
          fi

      - name: Build static armhf binary
        run: |
          docker run --rm -v "$PWD":/app -w /app "$IMAGE" \
            cargo build --release --locked --target "$RUST_TARGET" --target-dir /app/target-armv7

      - name: Package KUAL extension zip
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          ext=packaging/extension
          # Same file set as `just package`.
          mkdir -p "$ext/bin"
          cp "target-armv7/$RUST_TARGET/release/kindlestorygraph" "$ext/bin/kindlestorygraph"
          chmod +x "$ext/bin/kindlestorygraph"
          cp config_example.ini manual_mappings.example.ini allowlist.example.ini "$ext/"
          zip="kindlestorygraph-$version-kual.zip"
          # Python's zipfile keeps the exec bits.
          python3 - "$ext" "$zip" <<'EOF'
          import os, sys, zipfile
          src, out = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk(src):
                  for name in sorted(files):
                      path = os.path.join(root, name)
                      z.write(path, os.path.relpath(path, src))
          EOF
          python3 -m zipfile -l "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Upload zip (pull requests)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Reuse a release created by hand for this tag, else create one.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --verify-tag \
              --title "KindleStoryGraph $TAG" --generate-notes
          fi
          echo "Attached $ZIP to release $TAG"
