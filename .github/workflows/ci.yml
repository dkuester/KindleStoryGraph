name: CI

# Pushes to main and pull requests only: a PR branch would otherwise run
# twice (push + pull_request).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Includes the end-to-end tests (tests/e2e.rs): the host binary against
      # the fake StoryGraph, which needs the runner's python3.
      - name: Test
        run: cargo test --locked

  # Virtual Kindle (tests/emu, docs/emulator.md): the static armhf binary and
  # the KUAL wrapper scripts in an emulated ARM container, including one sync
  # against the fake StoryGraph.
  emu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (linux/arm/v7)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Cross-build the armhf binary
        run: just build
      - name: Smoke suite
        run: just emu-test
