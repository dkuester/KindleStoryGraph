# KindleStoryGraph sync allowlist ("positive list").
# Copy to allowlist.ini (same folder as config.ini).
#
# One Kindle content key (cde_key) per line. Only books listed here are synced
# (unless sync_scope=all is set in config.ini).
#
# To find a book's cde_key:
#   - tap "Sync selection" in the KUAL menu (toggle books there directly), or
#   - run `kindlestorygraph books` (host), or
#   - check the daemon log for a skipped book.
#
# Lines starting with # or ; are ignored. An optional "=…" suffix is allowed.

