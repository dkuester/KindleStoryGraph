# KindleStoryGraph manual mappings.
# Copy to manual_mappings.ini (same folder as config.ini) and add one line per
# book that the automatic title search cannot identify.
#
#   <cde_key> = <storygraph_book_id>
#
# How to find the two values:
#   1. cde_key — shown in the daemon log as a `no_match` entry, e.g.
#        NoMatch { cde_key: "B0123ABCD4" }
#      (also visible with `kindlestorygraph snapshot <cc.db>`).
#   2. storygraph_book_id — open the book on app.thestorygraph.com and copy the
#      UUID from the URL (app.thestorygraph.com/books/<UUID>), or find it with
#      `kindlestorygraph search "<title>"`.
#
# A mapping overrides any automatic match; it takes effect on the next sync
# cycle. Lines starting with # or ; are ignored.

#B0123ABCD4=00000000-0000-0000-0000-000000000000
