[package]
name = "kindlestorygraph"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "blocking", "cookies", "form"] }
retry = "2.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
urlencoding = "2.1.3"
webpki-root-certs = "1.0.9"
