# KindleStoryGraph configuration.
# Copy to config.ini and fill in your values.

# StoryGraph session cookies (from browser DevTools → Application → Cookies → app.thestorygraph.com)
session_cookie=
remember_user_token=

# Optional: your StoryGraph username/slug (auto-detected if empty)
user_slug=

# Enable debug logging to stderr
debug=false

# Kindle content catalog path (on-device)
cc_db_path=/var/local/cc.db

# Local sync-state file
state_path=/mnt/us/extensions/kindlestorygraph/state.json

# Percent at or above which a book counts as finished
finish_threshold=99.5

# Minimum percent delta before a progress update is pushed
progress_step=1.0

# Daemon poll interval in seconds
poll_interval=900

# Minimum title-match score (0..1) to auto-attach a book to StoryGraph
match_threshold=0.6

# A book is only synced once its progress reaches this percent (Kindle jumps
# to ~1 % when a book is first opened — keep those out of the sync)
min_progress=2.0

# Manual cde_key -> storygraph_id mappings file (for books that can't be
# matched automatically)
manual_mappings_path=/mnt/us/extensions/kindlestorygraph/manual_mappings.ini

# Which books to sync: "allowlist" (default — only the books you selected) or
# "all" (every book with progress)
sync_scope=allowlist

# Allowlist file (one cde_key per line); books listed here are synced
allowlist_path=/mnt/us/extensions/kindlestorygraph/allowlist.ini

# Cache of StoryGraph search results for the KUAL "Link books" picker
search_cache_path=/mnt/us/extensions/kindlestorygraph/search_cache.json

# KUAL menu file that the extension regenerates (bin/refresh-menu.sh, toggle,
# link, find-matches). It must match the <menu> entry in config.xml.
menu_path=/mnt/us/extensions/kindlestorygraph/menu.json
