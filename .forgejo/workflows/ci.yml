name: CI

# Pushes to main and pull requests only: a PR branch would otherwise run
# twice (push + pull_request) on Codeberg's shared runners.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The default image (catthehacker/ubuntu:act-latest) ships no Rust
    # toolchain. A cold build (rusqlite bundled C, reqwest/rustls, scraper)
    # plus clippy does not fit codeberg-tiny's 2-minute limit; codeberg-medium
    # allows 10 minutes on 4 CPUs.
    runs-on: codeberg-medium
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
